<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Impacto que transforma</title>
<desc id="d">Composición editorial abstracta que representa personas, colaboración y oportunidades.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18324F"/><stop offset=".58" stop-color="#3E608F"/><stop offset="1" stop-color="#8298AE"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="900" rx="42" fill="url(#bg)"/>
